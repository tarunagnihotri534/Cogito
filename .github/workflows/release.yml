name: Release & Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  test-and-smoke:
    name: Test & Clean-Room Smoke Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Type Check & Lint
        run: npm run lint

      - name: Run Test Suite
        run: npm test

      - name: Build Project & Assets
        run: npm run build

      - name: Run Clean-Room Smoke Test
        run: bash scripts/smoke-test.sh

  publish-npm:
    name: Publish to npm (Provenance & OIDC / Token)
    needs: test-and-smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for npm provenance & trusted publishing OIDC
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install Dependencies & Build
        run: |
          npm ci
          npm run build

      - name: Publish Package to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # Trusted publishing automatically requests and verifies the GitHub Actions OIDC token.
          # If NPM_TOKEN is provided as a fallback secret, NODE_AUTH_TOKEN authenticates the request.
          npm publish --provenance --access public

  docker-and-release:
    name: Build GHCR Image & Create GitHub Release
    needs: publish-npm
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required for GitHub Releases
      packages: write # Required for GHCR push
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Release Version
        id: version
        run: |
          RAW_TAG="${{ github.ref_name }}"
          VERSION="${RAW_TAG#v}"
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "tag=${VERSION}" >> $GITHUB_OUTPUT

      - name: Extract Changelog Section
        run: |
          node -e '
            const fs = require("fs");
            const ver = process.env.VERSION;
            const changelog = fs.readFileSync("CHANGELOG.md", "utf8");
            const escapedVer = ver.replace(/\./g, "\\.");
            const regex = new RegExp(`## \\\\\\[${escapedVer}\\\\\\][^\n]*\n([\\s\\S]*?)(?=\n## \\\\\\[|$)`);
            const match = changelog.match(regex);
            const notes = match ? match[1].trim() : `Release v${ver}`;
            fs.writeFileSync("RELEASE_NOTES.md", notes);
          '
          cat RELEASE_NOTES.md

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ env.VERSION }}
            ghcr.io/${{ github.repository }}:latest

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          name: "decision-tracker v${{ env.VERSION }}"
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false

  post-publish-verify:
    name: Verify Published Package via Clean Container
    needs: publish-npm
    runs-on: ubuntu-latest
    container:
      image: node:20-bookworm-slim
    steps:
      - name: Install curl / ca-certificates
        run: |
          apt-get update && apt-get install -y --no-install-recommends ca-certificates curl && rm -rf /var/lib/apt/lists/*

      - name: Test npx from npm Registry
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Waiting 20 seconds for npm registry CDN consistency..."
          sleep 20
          echo "Running: npx --yes decision-tracker@${VERSION} --version"
          REPORTED=$(npx --yes "decision-tracker@${VERSION}" --version)
          echo "Reported version: $REPORTED"
          if [ "$REPORTED" != "$VERSION" ]; then
            echo "Error: Version mismatch! Expected $VERSION, got $REPORTED"
            exit 1
          fi
          echo "Verification passed! decision-tracker@${VERSION} is live and functional."
