<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <marker id="arrow3" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#94a3b8" />
    </marker>
    <filter id="shadow3" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <rect width="940" height="300" rx="14" fill="url(#bgGrad3)" stroke="#334155" stroke-width="1.5" />
  <text x="30" y="38" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" letter-spacing="0.5">DECISION LIFECYCLE &amp; EVOLUTION</text>

  <!-- Recorded -->
  <g filter="url(#shadow3)">
    <rect x="30" y="110" width="180" height="70" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <text x="120" y="140" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Decision Recorded</text>
    <text x="120" y="158" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle">Author or AI captures choice</text>
  </g>

  <path d="M 210 145 L 260 145" stroke="#94a3b8" stroke-width="1.8" fill="none" marker-end="url(#arrow3)" />

  <!-- Active State -->
  <g filter="url(#shadow3)">
    <rect x="270" y="105" width="200" height="80" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="2" />
    <circle cx="295" cy="132" r="6" fill="#34d399" />
    <text x="310" y="136" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">.decisions/active/</text>
    <text x="310" y="155" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10">Actively matched on file edits</text>
    <text x="310" y="169" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10">Synchronized to agent rules</text>
  </g>

  <path d="M 470 135 L 540 85" stroke="#f59e0b" stroke-width="1.5" fill="none" marker-end="url(#arrow3)" />
  <path d="M 470 155 L 540 205" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arrow3)" />

  <!-- Superseded State -->
  <g filter="url(#shadow3)">
    <rect x="550" y="60" width="200" height="65" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" />
    <text x="565" y="85" fill="#f59e0b" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">.decisions/superseded/</text>
    <text x="565" y="103" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="10">Better approach replaces older choice;</text>
    <text x="565" y="116" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9">Preserves full rationale lineage</text>
  </g>

  <!-- Archived State -->
  <g filter="url(#shadow3)">
    <rect x="550" y="175" width="200" height="65" rx="8" fill="#1e293b" stroke="#64748b" stroke-width="1.5" />
    <text x="565" y="200" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">.decisions/archived/</text>
    <text x="565" y="218" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="10">Code retired or obsolete constraint;</text>
    <text x="565" y="231" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="9">Retained for historical audit</text>
  </g>

  <!-- Supersession feedback arrow to active -->
  <path d="M 750 92 C 810 92, 810 16, 370 16 C 370 16, 370 70, 370 95" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4,4" fill="none" marker-end="url(#arrow3)" />
  <text x="560" y="26" fill="#f59e0b" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600">New replacement decision activates in active/</text>
</svg>
