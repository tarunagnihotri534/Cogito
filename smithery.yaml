# Smithery.ai configuration for Cogito
# https://smithery.ai/docs/config
startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      workspace:
        type: string
        description: Path to target repository workspace (defaults to current working directory)
  commandFunction: |-
    (config) => ({
      command: 'npx',
      args: ['-y', 'cogito-cli@0.1.0', 'serve', ...(config?.workspace ? [config.workspace] : [])]
    })
  exampleConfig:
    workspace: "."
